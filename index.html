<title>Horor serem</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Figtree:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* Layout: full-screen 3D cake stage. Headline top-left, message card and actions along the bottom.
   One deliberate night theme: plum sky, rose and gold light. */
:root {
  color-scheme: dark;
  --night: #130a22;
  --night-2: #2a1445;
  --rose: #ff5c8a;
  --rose-soft: #ffb3c9;
  --gold: #ffd27a;
  --ink: #fff4f7;
  --ink-dim: #d3bfdc;
  --panel: rgba(36, 18, 56, 0.8);
  --panel-line: rgba(255, 179, 201, 0.28);
  --font-display: 'Instrument Serif', Georgia, 'Times New Roman', serif;
  --font-body: 'Figtree', system-ui, -apple-system, 'Segoe UI', sans-serif;
}
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--night);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 16px;
  overflow: hidden;
}
#stage {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  display: block;
  touch-action: none;
  cursor: grab;
  background: radial-gradient(ellipse at 50% 35%, var(--night-2) 0%, var(--night) 72%);
}
#stage:active { cursor: grabbing; }

.ui {
  position: fixed;
  inset: 0;
  display: grid;
  grid-template-rows: auto 1fr auto;
  pointer-events: none;
  padding-top: calc(24px + env(safe-area-inset-top, 0px));
  padding-bottom: calc(20px + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.top { min-width: 0; }
.eyebrow {
  margin: 0 0 0.5rem;
  font-size: 0.8rem;
  font-weight: 500;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: var(--gold);
}
h1 {
  margin: 0;
  font-family: var(--font-display);
  font-style: italic;
  font-weight: 400;
  font-size: clamp(3rem, 11vw, 6.5rem);
  line-height: 1;
  text-wrap: balance;
  overflow-wrap: anywhere;
  text-shadow: 0 0 44px rgba(255, 92, 138, 0.5);
}
.hint {
  margin: 0.9rem 0 0;
  max-width: 32ch;
  color: var(--ink-dim);
  line-height: 1.5;
}

.bottom {
  display: flex;
  flex-wrap: wrap;
  align-items: flex-end;
  justify-content: space-between;
  gap: 16px;
}
.card {
  pointer-events: auto;
  flex: 1 1 20rem;
  min-width: 0;
  max-width: 30rem;
  padding: 20px 22px;
  border-radius: 20px;
  background: var(--panel);
  border: 1px solid var(--panel-line);
  -webkit-backdrop-filter: blur(10px);
  backdrop-filter: blur(10px);
  animation: rise 0.7s ease both;
}
.card .label {
  margin: 0 0 0.6rem;
  font-size: 0.75rem;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--gold);
}
.msg {
  margin: 0 0 0.9rem;
  font-family: var(--font-display);
  font-size: 1.4rem;
  line-height: 1.4;
}
.sign { margin: 0; color: var(--rose-soft); }

.actions {
  pointer-events: auto;
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  margin-left: auto;
}
button {
  font: inherit;
  font-weight: 500;
  cursor: pointer;
  border-radius: 999px;
  padding: 0.8rem 1.4rem;
  min-height: 44px;
}
.btn-main {
  background: var(--rose);
  color: #2a0b18;
  border: 0;
  font-weight: 700;
}
.btn-main:hover { background: #ff7a9f; }
.btn-ghost {
  background: rgba(36, 18, 56, 0.65);
  color: var(--ink);
  border: 1px solid rgba(255, 179, 201, 0.4);
}
.btn-ghost:hover { background: rgba(60, 30, 90, 0.8); }
button:focus-visible { outline: 3px solid var(--gold); outline-offset: 3px; }

.flash {
  position: fixed;
  inset: 0;
  pointer-events: none;
  opacity: 0;
  background: radial-gradient(circle at 50% 55%, rgba(255, 228, 238, 0.95) 0%, rgba(255, 92, 138, 0.5) 35%, rgba(255, 92, 138, 0) 70%);
  animation: flash 1.2s ease-out 0.3s both;
}
.eyebrow { animation: fade 0.8s ease 0.6s both; }
h1 { animation: pop 1s cubic-bezier(0.2, 1.5, 0.4, 1) 0.55s both; transform-origin: left center; }
.hint { animation: fade 0.8s ease 1.4s both; }
.actions { animation: fade 0.8s ease 1.6s both; }
@keyframes flash {
  0% { opacity: 0; }
  12% { opacity: 1; }
  100% { opacity: 0; }
}
@keyframes pop {
  from { opacity: 0; transform: scale(0.4) rotate(-4deg); }
  to { opacity: 1; transform: none; }
}
@keyframes fade {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: none; }
}
@keyframes rise {
  from { opacity: 0; transform: translateY(18px); }
  to { opacity: 1; transform: none; }
}
@media (prefers-reduced-motion: reduce) {
  .card, .flash, .eyebrow, h1, .hint, .actions { animation: none; }
}
@media (max-width: 560px) {
  .bottom { flex-direction: column; align-items: stretch; }
  .card { max-width: none; flex-basis: auto; }
  .actions { margin-left: 0; }
  .actions button { flex: 1 1 auto; }
  .msg { font-size: 1.2rem; }
}
</style>

<canvas id="stage" aria-hidden="true"></canvas>
<div class="flash" aria-hidden="true"></div>

<main class="ui">
  <header class="top">
    <p class="eyebrow">Selamat ulang tahun ke 15 tahun</p>
    <h1 id="out-name">Reynaaaaa</h1>
    <p class="hint" id="hint" aria-live="polite">Seret untuk memutar kue, ketuk layar untuk kembang api. Tiup lilinnya untuk membuka pesanku.</p>
  </header>
  <div></div>
  <section class="bottom">
    <article class="card" id="card" hidden>
      <p class="label">Pesan untukmu</p>
      <p class="msg" id="out-msg"></p>
      <p class="sign" id="out-from"></p>
    </article>
    <div class="actions">
      <button class="btn-ghost" id="music" type="button" aria-pressed="true">Musik: nyala</button>
      <button class="btn-ghost" id="boom" type="button">Kembang api</button>
      <button class="btn-main" id="blow" type="button">Tiup lilin</button>
    </div>
  </section>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function () {
  // Ubah tiga baris ini untuk mengganti nama, pengirim, dan pesan.
  var CONFIG = {
    name: 'REYNAAAAA',
    from: '7 NOVEMBER 2026',
    message: 'Terima kasih sudah hadir di hidupku dan membuat hari-hariku lebih hangat. Semoga tahun ini penuh tawa, sehat, dan semua yang kamu harapkan menjadi nyata. Selamat bertambah usia, REYNAAAAA.'
  };

  var hint = document.getElementById('hint');
  var card = document.getElementById('card');
  var blowBtn = document.getElementById('blow');
  var musicBtn = document.getElementById('music');
  var HINT_START = hint.textContent;
  document.getElementById('out-name').textContent = CONFIG.name;
  document.getElementById('out-msg').textContent = CONFIG.message;
  document.getElementById('out-from').textContent = '— ' + CONFIG.from;

  if (!window.THREE) { hint.textContent = 'Tampilan 3D gagal dimuat. Muat ulang halaman.'; return; }

  var canvas = document.getElementById('stage');
  var renderer;
  try {
    renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true, alpha: true });
  } catch (err) {
    hint.textContent = 'Perangkat ini belum mendukung tampilan 3D.';
    return;
  }
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.setClearColor(0x000000, 0);

  var calm = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var scene = new THREE.Scene();
  scene.fog = new THREE.Fog(0x130a22, 45, 95);
  var camera = new THREE.PerspectiveCamera(45, 1, 0.1, 200);
  var lookY = 1.9, camDist = 11, introP = 0, introT = 0;

  function applyCamera() {
    var e = introP >= 1 ? 1 : 1 - Math.pow(1 - introP, 3);
    var far = 1 + (1 - e) * 0.7;
    camera.position.set(0, camDist * 0.3 * far + (1 - e) * 3, camDist * far);
    camera.lookAt(0, lookY, 0);
  }
  function resize() {
    var w = window.innerWidth, h = window.innerHeight;
    renderer.setSize(w, h, false);
    camera.aspect = w / h;
    camDist = Math.max(11, 4.8 / (Math.tan(camera.fov * Math.PI / 360) * camera.aspect));
    lookY = camera.aspect < 0.9 ? 1.0 : 1.9;
    applyCamera();
    camera.updateProjectionMatrix();
  }
  window.addEventListener('resize', resize);
  resize();

  function M(color, rough, metal, emissive) {
    var m = new THREE.MeshStandardMaterial({ color: color, roughness: rough == null ? 0.45 : rough, metalness: metal || 0 });
    if (emissive) { m.emissive = new THREE.Color(emissive); m.emissiveIntensity = 0.35; }
    return m;
  }
  function glowTex(inner, outer) {
    var c = document.createElement('canvas');
    c.width = c.height = 128;
    var g = c.getContext('2d');
    var gr = g.createRadialGradient(64, 64, 0, 64, 64, 64);
    gr.addColorStop(0, inner);
    gr.addColorStop(1, outer);
    g.fillStyle = gr;
    g.fillRect(0, 0, 128, 128);
    return new THREE.CanvasTexture(c);
  }
  function heartGeo(scale) {
    var s = new THREE.Shape();
    s.moveTo(0, -0.9);
    s.bezierCurveTo(-0.2, -0.7, -1, -0.2, -1, 0.35);
    s.bezierCurveTo(-1, 0.85, -0.45, 1.05, 0, 0.6);
    s.bezierCurveTo(0.45, 1.05, 1, 0.85, 1, 0.35);
    s.bezierCurveTo(1, -0.2, 0.2, -0.7, 0, -0.9);
    var g = new THREE.ExtrudeGeometry(s, { depth: 0.35, bevelEnabled: true, bevelSize: 0.08, bevelThickness: 0.08, bevelSegments: 3, curveSegments: 16 });
    g.center();
    g.scale(scale, scale, scale);
    return g;
  }

  // Lights
  scene.add(new THREE.AmbientLight(0x9a7fc0, 0.65));
  var key = new THREE.DirectionalLight(0xffc9dc, 0.9);
  key.position.set(4, 8, 6);
  scene.add(key);
  var rim = new THREE.DirectionalLight(0x7a6cff, 0.8);
  rim.position.set(-6, 4, -6);
  scene.add(rim);
  var warm = new THREE.PointLight(0xffb366, 1.3, 14);
  warm.position.set(0, 3.8, 0);
  scene.add(warm);

  // Floor
  var floor = new THREE.Mesh(new THREE.CircleGeometry(16, 64), M(0x1b0e2c, 0.95));
  floor.rotation.x = -Math.PI / 2;
  floor.position.y = -0.01;
  scene.add(floor);
  var halo = new THREE.Mesh(new THREE.RingGeometry(3.7, 3.95, 64), new THREE.MeshBasicMaterial({ color: 0xff5c8a, transparent: true, opacity: 0.35, side: THREE.DoubleSide }));
  halo.rotation.x = -Math.PI / 2;
  halo.position.y = 0.01;
  scene.add(halo);

  // Stars
  var starCount = 700;
  var sp = new Float32Array(starCount * 3);
  for (var i = 0; i < starCount; i++) {
    var r = 40 + Math.random() * 30;
    var th = Math.random() * Math.PI * 2;
    var ph = Math.acos(1 - Math.random() * 1.1);
    sp[i * 3] = r * Math.sin(ph) * Math.cos(th);
    sp[i * 3 + 1] = Math.abs(r * Math.cos(ph)) * 0.8 + 2;
    sp[i * 3 + 2] = r * Math.sin(ph) * Math.sin(th);
  }
  var starGeo = new THREE.BufferGeometry();
  starGeo.setAttribute('position', new THREE.BufferAttribute(sp, 3));
  var starMat = new THREE.PointsMaterial({ color: 0xffe9f0, size: 0.35, sizeAttenuation: true, transparent: true, opacity: 0.9, fog: false });
  var stars = new THREE.Points(starGeo, starMat);
  scene.add(stars);

  // World group (cake and hearts rotate together)
  var world = new THREE.Group();
  scene.add(world);

  var plate = new THREE.Mesh(new THREE.CylinderGeometry(3.3, 3.5, 0.18, 64), M(0xffd27a, 0.3, 0.6));
  plate.position.y = 0.09;
  world.add(plate);

  var tiers = [
    { r: 2.4, h: 1.0, c: 0xff8fb1 },
    { r: 1.75, h: 0.9, c: 0xfff0f5 },
    { r: 1.1, h: 0.8, c: 0xff5c8a }
  ];
  var y = 0.18;
  tiers.forEach(function (t) {
    var body = new THREE.Mesh(new THREE.CylinderGeometry(t.r, t.r, t.h, 64), M(t.c, 0.5));
    body.position.y = y + t.h / 2;
    world.add(body);
    var ring = new THREE.Mesh(new THREE.TorusGeometry(t.r, 0.09, 12, 64), M(0xffffff, 0.35));
    ring.rotation.x = Math.PI / 2;
    ring.position.y = y + t.h;
    world.add(ring);
    var drips = 16;
    for (var d = 0; d < drips; d++) {
      var a = (d / drips) * Math.PI * 2 + Math.random() * 0.2;
      var drip = new THREE.Mesh(new THREE.SphereGeometry(0.11, 12, 12), M(0xffffff, 0.35));
      drip.scale.set(1, 1.6 + Math.random() * 1.6, 1);
      drip.position.set(Math.cos(a) * (t.r - 0.02), y + t.h - 0.14, Math.sin(a) * (t.r - 0.02));
      world.add(drip);
    }
    var pearls = 28;
    for (var p = 0; p < pearls; p++) {
      var b = (p / pearls) * Math.PI * 2;
      var pearl = new THREE.Mesh(new THREE.SphereGeometry(0.07, 10, 10), M(0xffd27a, 0.25, 0.7));
      pearl.position.set(Math.cos(b) * (t.r + 0.02), y + 0.14, Math.sin(b) * (t.r + 0.02));
      world.add(pearl);
    }
    y += t.h;
  });
  var topY = y;

  // Heart topper
  var topper = new THREE.Mesh(heartGeo(0.3), M(0xff5c8a, 0.25, 0.1, 0xff2f6a));
  topper.position.y = topY + 0.5;
  world.add(topper);

  // Candles
  var flameTex = glowTex('rgba(255,214,140,1)', 'rgba(255,150,60,0)');
  var candleColors = [0xffffff, 0xff8fb1, 0xffd27a, 0xff8fb1, 0xffffff];
  var flames = [];
  for (var c = 0; c < 5; c++) {
    var ang = (c / 5) * Math.PI * 2 + Math.PI / 5;
    var cx = Math.cos(ang) * 0.72, cz = Math.sin(ang) * 0.72;
    var candle = new THREE.Mesh(new THREE.CylinderGeometry(0.055, 0.055, 0.6, 16), M(candleColors[c], 0.5));
    candle.position.set(cx, topY + 0.3, cz);
    world.add(candle);
    var wick = new THREE.Mesh(new THREE.CylinderGeometry(0.01, 0.01, 0.1, 6), M(0x2a1a20, 0.9));
    wick.position.set(cx, topY + 0.65, cz);
    world.add(wick);
    var fg = new THREE.Group();
    fg.position.set(cx, topY + 0.8, cz);
    var fl = new THREE.Mesh(new THREE.SphereGeometry(0.09, 12, 12), new THREE.MeshBasicMaterial({ color: 0xffe08a }));
    fl.scale.set(1, 1.7, 1);
    fg.add(fl);
    var gl = new THREE.Sprite(new THREE.SpriteMaterial({ map: flameTex, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false }));
    gl.scale.set(0.9, 0.9, 1);
    fg.add(gl);
    world.add(fg);
    flames.push({ group: fg, glow: gl, k: 1, target: 1, phase: Math.random() * 6.28 });
  }

  // Floating hearts
  var hGeo = heartGeo(0.3);
  var heartColors = [0xff5c8a, 0xffb3c9, 0xff8fb1, 0xffd27a, 0xff3d77];
  var hearts = [];
  for (var h = 0; h < 14; h++) {
    var ha = (h / 14) * Math.PI * 2 + Math.random() * 0.4;
    var hr = 4.2 + Math.random() * 2.4;
    var mesh = new THREE.Mesh(hGeo, M(heartColors[h % heartColors.length], 0.3, 0.1, heartColors[h % heartColors.length]));
    var baseY = 0.9 + Math.random() * 6.5;
    mesh.position.set(Math.cos(ha) * hr, baseY, Math.sin(ha) * hr);
    var sc = 0.7 + Math.random() * 0.9;
    mesh.scale.set(sc, sc, sc);
    mesh.userData = { y: baseY, speed: 0.6 + Math.random() * 0.8, phase: Math.random() * 6.28, rs: 0.3 + Math.random() * 0.6, s: sc };
    world.add(mesh);
    hearts.push(mesh);
  }

  // Confetti
  var CF = 260;
  var cfPos = new Float32Array(CF * 3), cfCol = new Float32Array(CF * 3);
  var cfVy = new Float32Array(CF), cfPh = new Float32Array(CF);
  var cfPalette = [0xff5c8a, 0xffd27a, 0xffb3c9, 0x9fd3ff, 0xc9a3ff, 0xffffff];
  var tmpC = new THREE.Color();
  for (var q = 0; q < CF; q++) {
    tmpC.setHex(cfPalette[q % cfPalette.length]);
    cfCol[q * 3] = tmpC.r; cfCol[q * 3 + 1] = tmpC.g; cfCol[q * 3 + 2] = tmpC.b;
    cfPos[q * 3 + 1] = -100;
    cfVy[q] = 1.2 + Math.random() * 1.6;
    cfPh[q] = Math.random() * 6.28;
  }
  var cfGeo = new THREE.BufferGeometry();
  cfGeo.setAttribute('position', new THREE.BufferAttribute(cfPos, 3));
  cfGeo.setAttribute('color', new THREE.BufferAttribute(cfCol, 3));
  var confetti = new THREE.Points(cfGeo, new THREE.PointsMaterial({ size: 0.2, vertexColors: true, sizeAttenuation: true, fog: false }));
  confetti.frustumCulled = false;
  scene.add(confetti);

  function cfRespawn(i, stagger) {
    cfPos[i * 3] = (Math.random() - 0.5) * 16;
    cfPos[i * 3 + 1] = stagger ? 2 + Math.random() * 12 : 11 + Math.random() * 2;
    cfPos[i * 3 + 2] = (Math.random() - 0.5) * 12;
  }

  // Fireworks and smoke
  var dotTex = glowTex('rgba(255,255,255,1)', 'rgba(255,255,255,0)');
  var smokeTex = glowTex('rgba(210,200,225,0.55)', 'rgba(210,200,225,0)');
  var bursts = [];
  var fwColors = [0xff5c8a, 0xffd27a, 0xffb3c9, 0x9fd3ff, 0xc9a3ff];
  function burst(at) {
    var n = calm ? 40 : 90;
    var cx = (Math.random() - 0.5) * 14, cy = 5 + Math.random() * 5, cz = -3 - Math.random() * 4;
    if (at && at.isVector3) { cx = at.x; cy = at.y; cz = at.z; }
    var pos = new Float32Array(n * 3), vel = new Float32Array(n * 3);
    for (var i = 0; i < n; i++) {
      pos[i * 3] = cx; pos[i * 3 + 1] = cy; pos[i * 3 + 2] = cz;
      var th = Math.random() * 6.283, ph = Math.acos(2 * Math.random() - 1), sp2 = 2.5 + Math.random() * 2.2;
      vel[i * 3] = Math.sin(ph) * Math.cos(th) * sp2;
      vel[i * 3 + 1] = Math.cos(ph) * sp2;
      vel[i * 3 + 2] = Math.sin(ph) * Math.sin(th) * sp2;
    }
    var g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    var m = new THREE.PointsMaterial({ color: fwColors[Math.floor(Math.random() * fwColors.length)], size: 0.32, map: dotTex, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, fog: false });
    var pts = new THREE.Points(g, m);
    pts.frustumCulled = false;
    scene.add(pts);
    bursts.push({ pts: pts, g: g, m: m, pos: pos, vel: vel, n: n, life: 1.8 });
  }
  var smokes = [];
  function puff(f) {
    var wp = new THREE.Vector3();
    f.group.getWorldPosition(wp);
    for (var i = 0; i < 3; i++) {
      var s = new THREE.Sprite(new THREE.SpriteMaterial({ map: smokeTex, transparent: true, depthWrite: false, opacity: 0.6 }));
      s.position.set(wp.x + (Math.random() - 0.5) * 0.1, wp.y + i * 0.15, wp.z + (Math.random() - 0.5) * 0.1);
      s.scale.set(0.3, 0.3, 1);
      scene.add(s);
      smokes.push({ s: s, life: 1.6 + Math.random() * 0.6, max: 2 });
    }
  }

  // Balloons rising around the cake
  var balloons = [];
  var bColors = [0xff5c8a, 0xffd27a, 0xff8fb1, 0x9fd3ff, 0xc9a3ff, 0xffffff];
  var bGeo = new THREE.SphereGeometry(0.5, 24, 24);
  var sGeo = new THREE.CylinderGeometry(0.012, 0.012, 1.5, 6);
  var sMat = new THREE.MeshBasicMaterial({ color: 0xd9c6e6 });
  function placeBalloon(b, fresh) {
    var a = Math.random() * Math.PI * 2, r = 4.5 + Math.random() * 3;
    b.userData.bx = Math.cos(a) * r;
    b.userData.bz = Math.sin(a) * r * 0.7 - 1;
    b.position.y = fresh ? -4 - Math.random() * 10 : -4;
  }
  for (var bi = 0; bi < 12; bi++) {
    var bg = new THREE.Group();
    var bm = new THREE.Mesh(bGeo, M(bColors[bi % bColors.length], 0.22, 0.1, bColors[bi % bColors.length]));
    bm.scale.set(1, 1.25, 1);
    bm.position.y = 0.8;
    var st = new THREE.Mesh(sGeo, sMat);
    st.position.y = -0.85;
    bg.add(bm);
    bg.add(st);
    bg.userData = { speed: 0.5 + Math.random() * 0.5, ph: Math.random() * 6.28, bx: 0, bz: 0 };
    var bs = 0.9 + Math.random() * 0.5;
    bg.scale.set(bs, bs, bs);
    placeBalloon(bg, true);
    scene.add(bg);
    balloons.push(bg);
  }

  // Confetti cannons from both sides
  var CN = 320;
  var cnPos = new Float32Array(CN * 3), cnVel = new Float32Array(CN * 3), cnCol = new Float32Array(CN * 3), cnPh = new Float32Array(CN);
  var cnTmp = new THREE.Color();
  for (var n = 0; n < CN; n++) {
    cnTmp.setHex(cfPalette[n % cfPalette.length]);
    cnCol[n * 3] = cnTmp.r; cnCol[n * 3 + 1] = cnTmp.g; cnCol[n * 3 + 2] = cnTmp.b;
    cnPos[n * 3 + 1] = -100;
    cnPh[n] = Math.random() * 6.28;
  }
  var cnGeo = new THREE.BufferGeometry();
  cnGeo.setAttribute('position', new THREE.BufferAttribute(cnPos, 3));
  cnGeo.setAttribute('color', new THREE.BufferAttribute(cnCol, 3));
  var cannonPts = new THREE.Points(cnGeo, new THREE.PointsMaterial({ size: 0.24, vertexColors: true, sizeAttenuation: true, fog: false }));
  cannonPts.frustumCulled = false;
  scene.add(cannonPts);
  function cannon() {
    var hw = (camera.position.z - 3) * Math.tan(camera.fov * Math.PI / 360) * camera.aspect;
    for (var i = 0; i < CN; i++) {
      var side = i % 2 ? 1 : -1;
      cnPos[i * 3] = side * hw * 0.95;
      cnPos[i * 3 + 1] = 0.2;
      cnPos[i * 3 + 2] = 2 + Math.random() * 3;
      cnVel[i * 3] = -side * hw * (0.2 + Math.random() * 0.55);
      cnVel[i * 3 + 1] = 7 + Math.random() * 8;
      cnVel[i * 3 + 2] = -1 - Math.random() * 3;
    }
    cnGeo.attributes.position.needsUpdate = true;
  }

  // Shockwave rings
  var shocks = [];
  function shock() {
    var m = new THREE.Mesh(new THREE.RingGeometry(0.92, 1, 64), new THREE.MeshBasicMaterial({ color: 0xff8fb1, transparent: true, opacity: 0.85, side: THREE.DoubleSide, blending: THREE.AdditiveBlending, depthWrite: false }));
    m.rotation.x = -Math.PI / 2;
    m.position.y = 0.08;
    m.scale.set(0.2, 0.2, 0.2);
    scene.add(m);
    shocks.push({ m: m, life: 1.4 });
  }

  function updateExtras(dt) {
    balloons.forEach(function (b) {
      var u = b.userData;
      b.position.y += u.speed * dt;
      b.position.x = u.bx + Math.sin(time * 0.8 + u.ph) * 0.4;
      b.position.z = u.bz;
      b.rotation.z = Math.sin(time + u.ph) * 0.08;
      if (b.position.y > 14) placeBalloon(b, false);
    });
    var live = false;
    for (var i = 0; i < CN; i++) {
      if (cnPos[i * 3 + 1] < -50) continue;
      cnVel[i * 3 + 1] -= 9 * dt;
      var drag = 1 - 0.45 * dt;
      cnVel[i * 3] *= drag; cnVel[i * 3 + 1] *= (1 - 0.3 * dt); cnVel[i * 3 + 2] *= drag;
      cnPos[i * 3] += cnVel[i * 3] * dt + Math.sin(time * 7 + cnPh[i]) * dt * 0.6;
      cnPos[i * 3 + 1] += cnVel[i * 3 + 1] * dt;
      cnPos[i * 3 + 2] += cnVel[i * 3 + 2] * dt;
      if (cnPos[i * 3 + 1] < 0 && cnVel[i * 3 + 1] < 0) cnPos[i * 3 + 1] = -100;
      else live = true;
    }
    if (live) cnGeo.attributes.position.needsUpdate = true;
    for (var s = shocks.length - 1; s >= 0; s--) {
      var sh = shocks[s];
      sh.life -= dt;
      if (sh.life <= 0) {
        scene.remove(sh.m); sh.m.geometry.dispose(); sh.m.material.dispose();
        shocks.splice(s, 1);
        continue;
      }
      var sc = 0.2 + (1 - sh.life / 1.4) * 18;
      sh.m.scale.set(sc, sc, sc);
      sh.m.material.opacity = (sh.life / 1.4) * 0.85;
    }
  }

  // Music (Happy Birthday melody, synthesized)
  var ac = null, master = null, musicOn = true;
  var NOTE = { G4: 392, A4: 440, B4: 493.88, C5: 523.25, D5: 587.33, E5: 659.25, F5: 698.46, G5: 783.99 };
  var melody = [
    ['G4', 0.75], ['G4', 0.25], ['A4', 1], ['G4', 1], ['C5', 1], ['B4', 2],
    ['G4', 0.75], ['G4', 0.25], ['A4', 1], ['G4', 1], ['D5', 1], ['C5', 2],
    ['G4', 0.75], ['G4', 0.25], ['G5', 1], ['E5', 1], ['C5', 1], ['B4', 1], ['A4', 2],
    ['F5', 0.75], ['F5', 0.25], ['E5', 1], ['C5', 1], ['D5', 1], ['C5', 2]
  ];
  function stopMelody() {
    if (master) {
      try { master.gain.value = 0; master.disconnect(); } catch (e) {}
      master = null;
    }
  }
  function playMelody() {
    if (!musicOn) return;
    try {
      ac = ac || new (window.AudioContext || window.webkitAudioContext)();
      if (ac.state === 'suspended') ac.resume();
      stopMelody();
      master = ac.createGain();
      master.gain.value = 1;
      master.connect(ac.destination);
      var t0 = ac.currentTime + 0.15, beat = 0.5;
      melody.forEach(function (n) {
        var dur = n[1] * beat;
        var osc = ac.createOscillator(), g = ac.createGain();
        osc.type = 'triangle';
        osc.frequency.value = NOTE[n[0]];
        g.gain.setValueAtTime(0.0001, t0);
        g.gain.exponentialRampToValueAtTime(0.2, t0 + 0.03);
        g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur * 0.95);
        osc.connect(g);
        g.connect(master);
        osc.start(t0);
        osc.stop(t0 + dur);
        t0 += dur;
      });
    } catch (e) {}
  }
  musicBtn.addEventListener('click', function () {
    musicOn = !musicOn;
    musicBtn.setAttribute('aria-pressed', String(musicOn));
    musicBtn.textContent = musicOn ? 'Musik: nyala' : 'Musik: mati';
    if (!musicOn) stopMelody();
    else if (celebrating) playMelody();
  });

  // Pop sound for fireworks (only after the viewer has tapped something)
  function pop(strength) {
    if (!musicOn) return;
    try {
      ac = ac || new (window.AudioContext || window.webkitAudioContext)();
      if (ac.state === 'suspended') ac.resume();
      var t = ac.currentTime, st = strength || 1;
      var o = ac.createOscillator(), g = ac.createGain();
      o.type = 'sine';
      o.frequency.setValueAtTime(190, t);
      o.frequency.exponentialRampToValueAtTime(40, t + 0.28);
      g.gain.setValueAtTime(0.5 * st, t);
      g.gain.exponentialRampToValueAtTime(0.001, t + 0.3);
      o.connect(g); g.connect(ac.destination);
      o.start(t); o.stop(t + 0.32);
      var len = Math.floor(ac.sampleRate * 0.25);
      var buf = ac.createBuffer(1, len, ac.sampleRate), d = buf.getChannelData(0);
      for (var i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3);
      var src = ac.createBufferSource();
      src.buffer = buf;
      var f = ac.createBiquadFilter();
      f.type = 'highpass'; f.frequency.value = 1200;
      var ng = ac.createGain();
      ng.gain.value = 0.35 * st;
      src.connect(f); f.connect(ng); ng.connect(ac.destination);
      src.start(t);
    } catch (e) {}
  }

  // Interaction
  var blown = false, celebrating = false, timers = [];
  function later(fn, ms) { timers.push(setTimeout(fn, ms)); }

  function blow() {
    blown = true;
    blowBtn.textContent = 'Nyalakan lagi';
    hint.textContent = 'Semoga semua harapanmu terkabul.';
    flames.forEach(function (f, i) {
      later(function () { f.target = 0; puff(f); }, i * 140);
    });
    later(celebrate, 900);
  }
  function celebrate() {
    celebrating = true;
    card.hidden = false;
    cannon();
    shock();
    pop(1.2);
    for (var i = 0; i < CF; i++) cfRespawn(i, true);
    for (var k = 0; k < 10; k++) later(burst, k * 650);
    playMelody();
  }
  function relight() {
    timers.forEach(clearTimeout);
    timers = [];
    blown = false;
    celebrating = false;
    stopMelody();
    card.hidden = true;
    blowBtn.textContent = 'Tiup lilin';
    hint.textContent = HINT_START;
    flames.forEach(function (f) { f.target = 1; });
    for (var i = 0; i < CF; i++) cfPos[i * 3 + 1] = -100;
    cfGeo.attributes.position.needsUpdate = true;
  }
  blowBtn.addEventListener('click', function () { if (blown) relight(); else blow(); });
  document.getElementById('boom').addEventListener('click', function () {
    for (var k = 0; k < 5; k++) setTimeout(burst, k * 220);
    cannon();
    shock();
    pop(1);
  });

  function tapBurst(x, y) {
    var v = new THREE.Vector3((x / window.innerWidth) * 2 - 1, -(y / window.innerHeight) * 2 + 1, 0.5).unproject(camera);
    var dir = v.sub(camera.position).normalize();
    burst(camera.position.clone().add(dir.multiplyScalar(camDist * 0.8)));
    pop(0.7);
  }

  var dragging = false, lastX = 0, lastY = 0, tilt = 0.08, downX = 0, downY = 0, downT = 0;
  canvas.addEventListener('pointerdown', function (e) {
    dragging = true; lastX = e.clientX; lastY = e.clientY;
    downX = e.clientX; downY = e.clientY; downT = performance.now();
    try { canvas.setPointerCapture(e.pointerId); } catch (err) {}
  });
  canvas.addEventListener('pointermove', function (e) {
    if (!dragging) return;
    world.rotation.y += (e.clientX - lastX) * 0.01;
    tilt = Math.max(-0.2, Math.min(0.6, tilt + (e.clientY - lastY) * 0.005));
    lastX = e.clientX; lastY = e.clientY;
  });
  function endDrag() { dragging = false; }
  canvas.addEventListener('pointerup', function (e) {
    dragging = false;
    if (Math.hypot(e.clientX - downX, e.clientY - downY) < 8 && performance.now() - downT < 400) tapBurst(e.clientX, e.clientY);
  });
  canvas.addEventListener('pointercancel', endDrag);

  // Animation loop
  var clock = new THREE.Clock(), time = 0;
  var autoSpeed = calm ? 0 : 0.18;
  function tick() {
    requestAnimationFrame(tick);
    var dt = Math.min(clock.getDelta(), 0.05);
    time += dt;

    if (introP < 1) {
      introP = Math.min(1, introP + dt / 2.8);
      applyCamera();
    }
    if (introT < 1.4) {
      introT += dt;
      var x = Math.min(1, introT / 1.2) - 1;
      var pop1 = 1 + 2.70158 * x * x * x + 1.70158 * x * x;
      var ws = Math.max(0.01, pop1);
      world.scale.set(ws, ws, ws);
    }
    updateExtras(dt);

    if (!dragging) {
      world.rotation.y += autoSpeed * dt;
      tilt += (0.08 - tilt) * Math.min(1, dt * 0.6);
    }
    world.rotation.x = tilt;

    var lit = 0;
    flames.forEach(function (f) {
      f.k += (f.target - f.k) * Math.min(1, dt * 9);
      if (f.target === 0 && f.k < 0.02) { f.k = 0; f.group.visible = false; }
      else f.group.visible = true;
      var fl = 1 + 0.12 * Math.sin(time * 14 + f.phase) + 0.06 * Math.sin(time * 23 + f.phase * 2);
      f.group.scale.set(f.k * (1 + (fl - 1) * 0.5), f.k * fl, f.k);
      lit += f.k;
    });
    warm.intensity = 1.3 * (lit / flames.length) * (0.92 + 0.08 * Math.sin(time * 13));

    hearts.forEach(function (m) {
      var u = m.userData;
      m.position.y = u.y + Math.sin(time * u.speed + u.phase) * (calm ? 0.1 : 0.35);
      m.rotation.y += dt * u.rs;
      m.rotation.z = Math.sin(time * 0.8 + u.phase) * 0.15;
      var s = u.s * (1 + 0.05 * Math.sin(time * 3 + u.phase));
      m.scale.set(s, s, s);
    });
    topper.rotation.y += dt * 1.2;
    var ts = 1 + 0.08 * Math.sin(time * 3);
    topper.scale.set(ts, ts, ts);

    stars.rotation.y += dt * 0.01;
    starMat.opacity = 0.78 + 0.22 * Math.sin(time * 1.5);

    if (celebrating || confetti.userData.active) {
      var any = false;
      for (var i = 0; i < CF; i++) {
        var yy = cfPos[i * 3 + 1];
        if (yy < -50) continue;
        yy -= cfVy[i] * dt;
        cfPos[i * 3] += Math.sin(time * 2 + cfPh[i]) * dt * 0.6;
        if (yy < 0) {
          if (celebrating) { cfRespawn(i, false); yy = cfPos[i * 3 + 1]; }
          else yy = -100;
        }
        cfPos[i * 3 + 1] = yy;
        any = true;
      }
      confetti.userData.active = any;
      cfGeo.attributes.position.needsUpdate = true;
    }

    for (var b = bursts.length - 1; b >= 0; b--) {
      var bu = bursts[b];
      bu.life -= dt;
      if (bu.life <= 0) {
        scene.remove(bu.pts); bu.g.dispose(); bu.m.dispose();
        bursts.splice(b, 1);
        continue;
      }
      for (var j = 0; j < bu.n; j++) {
        bu.vel[j * 3 + 1] -= 2.2 * dt;
        bu.vel[j * 3] *= 0.985; bu.vel[j * 3 + 1] *= 0.985; bu.vel[j * 3 + 2] *= 0.985;
        bu.pos[j * 3] += bu.vel[j * 3] * dt;
        bu.pos[j * 3 + 1] += bu.vel[j * 3 + 1] * dt;
        bu.pos[j * 3 + 2] += bu.vel[j * 3 + 2] * dt;
      }
      bu.g.attributes.position.needsUpdate = true;
      bu.m.opacity = Math.max(0, bu.life / 1.8);
    }

    for (var s = smokes.length - 1; s >= 0; s--) {
      var sm = smokes[s];
      sm.life -= dt;
      if (sm.life <= 0) {
        scene.remove(sm.s); sm.s.material.dispose();
        smokes.splice(s, 1);
        continue;
      }
      sm.s.position.y += dt * 0.7;
      sm.s.position.x += Math.sin(time * 3 + s) * dt * 0.1;
      var gs = 0.3 + (1 - sm.life / sm.max) * 0.9;
      sm.s.scale.set(gs, gs, 1);
      sm.s.material.opacity = Math.max(0, (sm.life / sm.max) * 0.6);
    }

    renderer.render(scene, camera);
  }
  // Opening: the cake pops in, the camera swoops, then shockwaves, cannons and fireworks
  if (calm) {
    introP = 1; introT = 2;
  } else {
    world.scale.set(0.01, 0.01, 0.01);
    setTimeout(function () { shock(); cannon(); }, 350);
    setTimeout(shock, 1000);
    [500, 900, 1300, 1700, 2100, 2600, 3100, 3700].forEach(function (ms) { setTimeout(burst, ms); });
  }
  tick();
})();
</script>
